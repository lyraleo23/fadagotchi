<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fadagotchi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: o brinquedo (casca de ovo perolada) à esquerda, a "ficha da fada" à direita; empilha no celular. Visual único, noturno. */
:root {
  color-scheme: dark;
  --dusk: #221a2c;
  --dusk-2: #2d2339;
  --line: #463a58;
  --cream: #f4eaf3;
  --muted: #b6a6c4;
  --shell-hi: #fbf1f8;
  --shell: #e6cfe6;
  --shell-lo: #b994c6;
  --shell-edge: #8e6aa0;
  --btn: #d4497f;
  --btn-lo: #9c2d5a;
  --ink: #2b2236;
  --sun: #ffd95a;
  --ok: #86d3a8;
  --warn: #efc265;
  --crit: #f07575;
  --f-display: "Silkscreen", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at 30% 0%, #3a2b4a 0%, var(--dusk) 55%) fixed, var(--dusk);
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1020px;
  margin: 0 auto;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 460px) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}
@media (max-width: 800px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

/* ---------- brinquedo ---------- */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.device {
  position: relative;
  width: min(450px, 100%);
  aspect-ratio: 0.74;
  border-radius: 50% 50% 47% 47% / 58% 58% 42% 42%;
  background:
    radial-gradient(ellipse at 32% 18%, var(--shell-hi) 0%, transparent 38%),
    radial-gradient(ellipse at 50% 60%, var(--shell) 0%, var(--shell-lo) 85%);
  box-shadow:
    inset 0 -14px 28px rgba(80, 40, 100, .35),
    inset 0 10px 20px rgba(255, 255, 255, .5),
    0 0 0 3px var(--shell-edge),
    0 24px 50px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding: 15% 8.5% 8%;
}
.loop {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  border: 5px solid var(--shell-edge); border-bottom-color: transparent;
  z-index: -1;
}
.brand { font-family: var(--f-display); font-size: 12px; letter-spacing: .18em; color: var(--shell-edge); }
.bezel {
  width: 100%;
  background: linear-gradient(180deg, #f9eef7, #eadbea);
  border-radius: 18px;
  padding: 8px 10px;
  box-shadow: inset 0 2px 6px rgba(80, 40, 100, .35);
  display: flex; flex-direction: column; gap: 6px;
}
.icons { display: grid; grid-template-columns: repeat(4, 1fr); }
.ico {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 3px 0; display: grid; place-items: center; border-radius: 6px;
  opacity: .32; transition: opacity .15s, transform .15s;
}
.ico canvas { width: 24px; height: 24px; image-rendering: pixelated; display: block; }
.ico.on { opacity: 1; transform: scale(1.12); }
.ico:hover { opacity: .8; }
.ico:focus-visible { outline: 2px solid var(--btn); outline-offset: 1px; opacity: 1; }
.seclabel {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: var(--ink); color: var(--cream);
  border-radius: 5px 5px 0 0;
  padding: 3px 9px;
  font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  min-height: 24px;
}
.seclabel b { font-weight: 700; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seclabel span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.screen-wrap { display: flex; flex-direction: column; }
.screen {
  position: relative;
  border-radius: 0 0 5px 5px;
  overflow: hidden;
  background: #1d2350;
  box-shadow: inset 0 0 0 3px var(--ink);
  cursor: pointer;
}
.screen canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.alert {
  position: absolute; top: 6px; right: 8px;
  width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--sun); color: var(--ink); box-shadow: 0 0 0 2px var(--ink);
  font-family: var(--f-display); font-weight: 700; font-size: 13px;
  opacity: 0;
}
.alert.on { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 1; } }
.btns { display: flex; gap: 26px; margin-top: 6px; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f287b0, var(--btn) 55%, var(--btn-lo));
  box-shadow: 0 4px 0 var(--btn-lo), 0 6px 10px rgba(0, 0, 0, .3);
  color: #fff; font-family: var(--f-display); font-size: 13px;
}
.btn:nth-child(2) { transform: translateY(8px); }
.btn:active { box-shadow: 0 1px 0 var(--btn-lo); translate: 0 3px; }
.btn:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

.caption {
  min-height: 3em; max-width: 36ch; text-align: center; margin: 0;
  color: var(--cream); font-size: 15px; text-wrap: balance;
}
.choices { display: flex; gap: 10px; }
.chip-btn {
  appearance: none; cursor: pointer; font: inherit; font-size: 14px;
  background: var(--dusk-2); color: var(--cream);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
}
.chip-btn:hover, .chip-btn:focus-visible { border-color: var(--btn); outline: none; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
kbd { font-family: var(--f-display); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---------- ficha ---------- */
.panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--f-display); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.name-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
#nome {
  font-family: var(--f-display); font-size: 30px; color: var(--cream);
  background: none; border: 0; border-bottom: 1px dashed var(--line);
  width: 9ch; padding: 0;
}
#nome:focus { outline: none; border-bottom-color: var(--btn); }
.meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }
.tag { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.crit { border-color: var(--crit); color: var(--crit); }
.tag.ok { border-color: var(--ok); color: var(--ok); }

.bars { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.bar { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 3ch; align-items: center; gap: 12px; }
.bar .lbl { font-size: 14px; }
.bar .lbl small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
.track { height: 10px; background: var(--dusk-2); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; width: 50%; background: var(--ok); transition: width .4s; }
.fill.warn { background: var(--warn); }
.fill.crit { background: var(--crit); }
.val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }

.block { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.log time { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 8px; font-size: 13px; }
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 14px; }
select, .ghost {
  font: inherit; font-size: 14px; color: var(--cream); background: var(--dusk-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer;
}
.ghost:hover, select:hover { border-color: var(--muted); }
.ghost.danger { border-color: var(--crit); color: var(--crit); }
label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); flex-wrap: wrap; }
.gone { background: var(--dusk-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.gone p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .alert.on { animation: none; opacity: 1; } .fill { transition: none; } }
</style>
</head>
<body>

<main class="wrap">
  <section class="stage" aria-label="Brinquedo">
    <div class="device">
      <span class="loop" aria-hidden="true"></span>
      <div class="brand">FADAGOTCHI</div>
      <div class="bezel">
        <div class="icons" id="iconsTop"></div>
        <div class="screen-wrap">
          <div class="seclabel" aria-live="polite"><b id="secName">Lumi</b><span id="secInfo"></span></div>
          <div class="screen" id="screen">
            <canvas id="lcd" width="768" height="480" aria-label="Tela da fada"></canvas>
            <span class="alert" id="alert" aria-hidden="true">!</span>
          </div>
        </div>
        <div class="icons" id="iconsBottom"></div>
      </div>
      <div class="btns">
        <button class="btn" id="bA" aria-label="Botão A: escolher">A</button>
        <button class="btn" id="bB" aria-label="Botão B: confirmar">B</button>
        <button class="btn" id="bC" aria-label="Botão C: voltar">C</button>
      </div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="choices" id="choices" hidden></div>
    <p class="hint"><kbd>A</kbd> escolhe · <kbd>B</kbd> confirma · <kbd>C</kbd> volta. Ou toque direto nos ícones.</p>
  </section>

  <aside class="panel" aria-label="Ficha da fada">
    <div class="head">
      <span class="eyebrow">Ficha da fada</span>
      <div class="name-row">
        <input id="nome" maxlength="10" aria-label="Nome da fada" spellcheck="false">
        <span class="meta" id="meta"></span>
      </div>
      <div class="tags" id="tags"></div>
    </div>

    <div id="goneBox" class="gone" hidden>
      <p id="goneText"></p>
      <button class="ghost" id="restart2">Plantar um novo botão de flor</button>
    </div>

    <ul class="bars" id="bars"></ul>

    <div class="block">
      <span class="eyebrow">Diário</span>
      <ul class="log" id="log"></ul>
    </div>

    <div class="block">
      <span class="eyebrow">Ajustes</span>
      <div class="controls">
        <label class="inline" for="skin">Visual
          <select id="skin">
            <option value="color">Colorido</option>
            <option value="lcd">Clássico (LCD)</option>
          </select>
        </label>
        <label class="inline" for="speed">Velocidade do tempo
          <select id="speed">
            <option value="1">1× (real)</option>
            <option value="10">10×</option>
            <option value="60">60× (1 min = 1 h)</option>
            <option value="600">600× (teste)</option>
          </select>
        </label>
        <label class="inline" for="sound"><input type="checkbox" id="sound"> Som</label>
        <span id="resetWrap"></span>
      </div>
    </div>
  </aside>
</main>

<script>
/* =====================================================================
   FADAGOTCHI — v0.3
   Arquitetura:
     1. Sprites   — pixel art (LCD monocromático + itens coloridos)
     2. Core      — estado + regras da simulação (não sabe nada de tela)
     3. Renderers — LcdRenderer (48×32, clássico) e ColorRenderer
                    (192×120, colorido HD, fada desenhada proceduralmente).
                    Interface comum: init(canvas), draw(state, ui, now).
                    O futuro renderer "realista" entra aqui.
     4. UI        — botões, ficha, persistência
   ===================================================================== */

/* ---------- 1. SPRITES (LCD) ---------- */
function S(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const d = new Uint8Array(w * h);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') d[y * w + x] = 1; });
  return { w, h, d };
}
const E = n => '.'.repeat(n);

const SPR = {
  adult: {
    base: [
      "......####......",
      ".....######.....",
      "....##....##....",
      "....#.#..#.#....",
      "....#......#....",
      "....#..##..#....",
      ".....#....#.....",
      "......####......",
      "....#.####.#....",
      "......####......",
      ".....######.....",
      "....########....",
      "......#..#......",
      "......#..#......",
      ".....##..##.....",
      "................"],
    faces: {
      happy: { 5: "....#.#..#.#....", 6: ".....#.##.#....." },
      sad:   { 5: "....#..##..#....", 6: ".....##..##....." },
      sleep: { 3: "....###..###...." },
    },
    wingsUp: [E(16), E(16),
      "##............##",
      "#.#..........#.#",
      "#..#........#..#",
      "#...#......#...#",
      ".#............#.",
      "..##........##.."],
    wingsDown: [E(16), E(16), E(16), E(16), E(16), E(16), E(16),
      "..##........##..",
      ".#..#......#..#.",
      "#...#......#...#",
      "#..#........#..#",
      ".##..........##."],
    y: 9,
  },
  baby: {
    base: [
      "..............",
      "....######....",
      "...#......#...",
      "..#........#..",
      "..#..#..#..#..",
      "..#........#..",
      "..#...##...#..",
      "...#......#...",
      "....######....",
      ".....#..#.....",
      ".............."],
    faces: {
      happy: { 6: "..#..#..#..#..", 7: "...#..##..#..." },
      sad:   { 6: "..#...##...#..", 7: "...#.#..#.#..." },
      sleep: { 4: "..#..##.##.#.." },
    },
    wingsUp: [E(14),
      "##..........##",
      "#.#........#.#",
      "#..#......#..#",
      ".##........##."],
    wingsDown: [E(14), E(14), E(14), E(14), E(14),
      "##..........##",
      "#.#........#.#",
      ".##........##."],
    y: 15,
  },
};
const bud = S([
  "....####....",
  "...#....#...",
  "..#..##..#..",
  "..#.#..#.#..",
  "..#..##..#..",
  "...#....#...",
  "....####....",
  ".....##.....",
  ".##..##..##.",
  "#..#.##.#..#",
  ".##..##..##.",
  ".....##....."]);

const ICON = {
  food: S(["...#....", "....#...", ".##.##..", "#..#..#.", "#......#", "#......#", ".#....#.", "..####.."]),
  pet: S(["........", ".##..##.", "#..##..#", "#......#", ".#....#.", "..#..#..", "...##...", "........"]),
  play: S(["...##...", "...##...", "########", ".######.", "..####..", ".##..##.", ".#....#.", "........"]),
  toilet: S(["####....", "#..#....", "#..#....", "#..#####", "#......#", ".#....#.", "..#..#..", "..####.."]),
  bath: S(["...#....", "...#....", "..#.#...", ".#...#..", "#.....#.", "#.#...#.", ".#...#..", "..###..."]),
  light: S(["..###...", ".#...#..", "#.....#.", "#.....#.", ".#...#..", "..###...", "..###...", "...#...."]),
  med: S(["..##....", "..##....", ".#..#...", "#....#..", "######..", "######..", ".####...", "........"]),
  status: S(["........", "#.......", "#..#....", "#..#..#.", "#..#..#.", "#..#..#.", "########", "........"]),
  moon: S(["..###...", ".##.....", "##......", "##......", "##......", ".##.....", "..###...", "........"]),
  cross: S(["..###...", "..#.#...", "###.###.", "#.....#.", "###.###.", "..#.#...", "..###...", "........"]),
};
const ITEM = {
  meal: S(["..####..", ".#.##.#.", "#......#", "########", "#......#", ".#....#.", "..####..", "........"]),
  candy: S(["........", "#..##..#", "##.##.##", "#.#..#.#", "##.##.##", "#..##..#", "........", "........"]),
  poop: S(["....#...", "...##...", "..#..#..", "..####..", ".#....#.", ".######.", "#......#", "########"]),
  heart: S([".#.#.", "#####", "#####", ".###.", "..#.."]),
  heartEmpty: S([".#.#.", "#.#.#", "#...#", ".#.#.", "..#.."]),
  arrowL: S(["..#..", ".##..", "#####", ".##..", "..#.."]),
  arrowR: S(["..#..", "..##.", "#####", "..##.", "..#.."]),
  arrowUp: S(["..#..", ".###.", "#####"]),
  z: S(["####", "..#.", ".#..", "####"]),
  spark: S([".#.", "###", ".#."]),
  cloud: S([".####...", "#....##.", "#......#", ".######.", "..#.#.#.", ".#.#.#.."]),
};
const pixieCache = {};
function pixieSprite(stage, face, up) {
  const key = stage + face + up;
  if (pixieCache[key]) return pixieCache[key];
  const def = SPR[stage];
  const rows = def.base.slice();
  const f = def.faces[face];
  if (f) for (const i in f) rows[i] = f[i];
  const wing = up ? def.wingsUp : def.wingsDown;
  const out = rows.map((r, y) => {
    const wr = wing[y] || '';
    let s = '';
    for (let x = 0; x < r.length; x++) s += (r[x] === '#' || wr[x] === '#') ? '#' : '.';
    return s;
  });
  return (pixieCache[key] = S(out));
}

/* ---------- 2. CORE (simulação) ---------- */
const MIN = 60000;
const cl = v => Math.max(0, Math.min(100, v));

function newState() {
  const now = Date.now();
  return {
    v: 1, name: 'Lumi', stage: 'bud', ageMin: 0, simTime: now, lastReal: now,
    hunger: 80, affection: 70, fun: 70, bladder: 10, hygiene: 95, energy: 90, health: 100,
    sick: false, poops: 0, asleep: false, lightsOff: false, sweets: [],
    gone: false, speed: 1, sound: false, skin: 'color', log: [],
  };
}

const Core = {
  hour(s) { const d = new Date(s.simTime); return d.getHours() + d.getMinutes() / 60; },
  isNight(s) { const h = this.hour(s); return h >= 22 || h < 7; },
  emit: () => {},
  stepMinute(s, dm) {
    s.ageMin += dm; s.simTime += dm * MIN;
    if (s.gone) return;
    if (s.stage === 'bud') {
      if (s.ageMin >= 0.5) { s.stage = 'baby'; this.emit('hatch'); }
      return;
    }
    if (s.stage === 'baby' && s.ageMin >= 24 * 60) { s.stage = 'adult'; this.emit('grow'); }
    const h = dm / 60, k = s.stage === 'baby' ? 1.3 : 1, p = s.poops;
    const night = this.isNight(s);

    if (!s.asleep) {
      if (s.energy <= 8 || night || (s.lightsOff && s.energy < 60)) { s.asleep = true; this.emit('sleep'); }
    } else if (!night && s.energy >= 90) {
      s.asleep = false; s.lightsOff = false; this.emit('wake');
    }

    if (s.asleep) {
      s.hunger = cl(s.hunger - 4 * k * h);
      s.fun = cl(s.fun - 2 * h);
      s.affection = cl(s.affection - (s.lightsOff ? 2 : 6) * h);
      s.hygiene = cl(s.hygiene - (2 + 8 * p) * h);
      s.energy = cl(s.energy + (s.lightsOff ? 22 : 10) * h);
      s.bladder = cl(s.bladder + 5 * h);
    } else {
      s.hunger = cl(s.hunger - 10 * k * h);
      s.fun = cl(s.fun - 9 * k * h);
      s.affection = cl(s.affection - 7 * k * h);
      s.hygiene = cl(s.hygiene - (5 + 8 * p) * h);
      s.energy = cl(s.energy - 7 * k * h);
      s.bladder = cl(s.bladder + 16 * k * h);
    }

    if (s.bladder >= 100) {
      s.poops = Math.min(3, s.poops + 1); s.bladder = 15;
      s.hygiene = cl(s.hygiene - 15); s.affection = cl(s.affection - 5);
      this.emit('accident');
    }

    s.sweets = s.sweets.filter(t => s.simTime - t < 6 * 60 * MIN);
    let risk = 0;
    if (s.poops >= 2) risk += .004;
    if (s.hygiene < 20) risk += .004;
    if (s.health < 40) risk += .003;
    if (s.sweets.length > 3) risk += .003;
    if (!s.sick && Math.random() < risk * dm) { s.sick = true; this.emit('sick'); }

    let dh = 0;
    for (const st of ['hunger', 'affection', 'fun', 'hygiene', 'energy']) if (s[st] <= 0) dh -= 8;
    if (s.sick) dh -= 10;
    if (s.poops >= 3) dh -= 4;
    if (dh === 0 && ['hunger', 'affection', 'fun', 'hygiene', 'energy'].every(st => s[st] >= 40)) dh = 4;
    s.health = cl(s.health + dh * h);
    if (s.health <= 0) { s.gone = true; this.emit('gone'); }
  },
  advance(s, minutes) {
    while (minutes > 1e-9) { const dm = Math.min(1, minutes); this.stepMinute(s, dm); minutes -= dm; }
  },
  needs(s) {
    if (s.gone || s.stage === 'bud') return [];
    const n = [];
    if (s.sick) n.push('está doente e precisa de poção');
    if (s.asleep) return n;
    if (s.hunger < 25) n.push('está com fome');
    if (s.bladder > 80) n.push('precisa ir ao banheiro');
    if (s.poops > 0) n.push('fez sujeira e precisa de banho');

    if (s.affection < 25) n.push('quer carinho');

/* expressão do momento (compartilhada pelos renderers) */
const HAPPY_ANIMS = ['eat', 'pet', 'toilet', 'bath', 'med', 'hatch', 'win', 'grow'];
function faceFor(s, anim) {
  let face = Core.mood(s);
  if (anim) {
    if (HAPPY_ANIMS.includes(anim.type)) face = 'happy';
    if (['refuse', 'lose', 'accident'].includes(anim.type)) face = 'sad';
  }
  if (s.asleep) face = 'sleep';
  return face;
}
const STATUS_PAGES = [
  { k: 'hunger', icon: 'food', label: 'Barriga' },
  { k: 'affection', icon: 'pet', label: 'Carinho' },
  { k: 'fun', icon: 'play', label: 'Diversão' },
  { k: 'bladder', icon: 'toilet', label: 'Banheiro', inv: true },
  { k: 'hygiene', icon: 'bath', label: 'Higiene' },
  { k: 'energy', icon: 'moon', label: 'Energia' },

const pageValue = (s, p) => p.inv ? 100 - s[p.k] : s[p.k];

/* ---------- 3a. LCD RENDERER (48×32, clássico) ---------- */
const LcdRenderer = (() => {
  const W = 48, H = 32, C = 10;
  const grid = new Uint8Array(W * H);
  let ctx;
  const pal = {
    on: { bg: '#a9b897', on: '#26301f', ghost: 'rgba(38,48,31,.07)' },
    off: { bg: '#27301f', on: '#7f9070', ghost: 'rgba(127,144,112,.05)' },
  };
  const px = (x, y) => { if (x >= 0 && x < W && y >= 0 && y < H) grid[y * W + x] = 1; };
  function blit(sp, x, y, crop = sp.w, scale = 1) {
    for (let j = 0; j < sp.h; j++) for (let i = 0; i < Math.min(sp.w, crop); i++)
      if (sp.d[j * sp.w + i]) for (let a = 0; a < scale; a++) for (let b = 0; b < scale; b++) px(x + i * scale + a, y + j * scale + b);
  }
  function flush(dark) {
    const p = dark ? pal.off : pal.on;
    ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W * C, H * C);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      ctx.fillStyle = grid[y * W + x] ? p.on : p.ghost;
      ctx.fillRect(x * C + 1, y * C + 1, C - 1, C - 1);
    }
  }

  function drawPixie(s, x, tick, face) {
    const def = SPR[s.stage];
    const flying = !s.asleep;
    const up = flying ? (tick % 2 === 0) : false;
    const bob = flying ? ((tick >> 1) % 2) : 1;
    const sp = pixieSprite(s.stage, face, up);
    const y = def.y + bob;
    blit(sp, x, y);
    return { x, y, w: sp.w, h: sp.h };
  }
  function sparkles(cx, cy, r, tick, n = 3) {
    for (let i = 0; i < n; i++) {
      const a = (tick * 0.9 + i * 2.1);
      blit(ITEM.spark, Math.round(cx + Math.cos(a) * r) - 1, Math.round(cy + Math.sin(a) * r * 0.7) - 1);
    }
  }

  function draw(s, ui, now) {
    grid.fill(0);
    const tick = Math.floor(now / 260);
    const dark = s.lightsOff;
    const anim = ui.anim && now - ui.anim.t0 < ui.anim.dur ? ui.anim : null;
    const prog = anim ? (now - anim.t0) / anim.dur : 0;

    if (s.gone) {
      for (let i = 0; i < 6; i++) if ((tick + i * 3) % 7 < 3) blit(ITEM.spark, (i * 17 + 5) % 44, (i * 11 + 3) % 28);
      return flush(false);
    }
    if (ui.view === 'status') {
      const p = STATUS_PAGES[ui.page];
      blit(ICON[p.icon], 3, 8, 8, 2);
      const full = Math.round(pageValue(s, p) / 25);
      for (let i = 0; i < 4; i++) blit(i < full ? ITEM.heart : ITEM.heartEmpty, 22 + i * 6, 13);
      for (let i = 0; i < STATUS_PAGES.length; i++) { px(17 + i * 2, 29); if (i === ui.page) px(17 + i * 2, 28); }
      return flush(false);
    }
    if (ui.view === 'food') {
      blit(ITEM.meal, 12, 9); blit(ITEM.candy, 28, 9);
      blit(ITEM.arrowUp, ui.foodIdx === 0 ? 13 : 29, 20);
      return flush(false);
    }
    if (ui.view === 'game') {
      const g = ui.game, w = spriteW(s);
      for (let i = 0; i < g.results.length; i++) {
        const x = 17 + i * 3;
        px(x, 1); if (g.results[i]) { px(x + 1, 1); px(x, 2); px(x + 1, 2); }
      }
      if (g.phase === 'ask') {
        drawPixie(s, Math.round((W - w) / 2), tick, 'neutral');
        if (tick % 2 === 0) { blit(ITEM.arrowL, 1, 14); blit(ITEM.arrowR, 42, 14); }
      } else {
        drawPixie(s, g.dir === 'L' ? 2 : 46 - w, tick, g.guess === g.dir ? 'happy' : 'sad');
      }
      return flush(false);
    }

    if (s.stage === 'bud') {
      const wob = s.ageMin > 0.35 ? (tick % 2 ? 1 : -1) : ((tick >> 2) % 2 ? 1 : 0);
      blit(bud, 18 + wob, 13);
      if (anim && anim.type === 'hatch') sparkles(24, 18, 12, tick, 4);
      return flush(dark);
    }

    for (let i = 0; i < s.poops; i++) {
      const x = 39 - i * 9;
      blit(ITEM.poop, x, 24);
      if (tick % 2 === i % 2) { px(x + 2, 21); px(x + 5, 20); } else { px(x + 3, 20); px(x + 6, 21); }
    }

    const w = spriteW(s);
    const maxX = Math.max(1, 47 - w - 9 * s.poops);
    let x = 1 + Math.round(ui.px * (maxX - 1));
    if (anim && anim.type === 'refuse') x += tick % 2 ? 1 : -1;
    const b = drawPixie(s, x, tick, faceFor(s, anim));
    const side = b.x + b.w + 1 <= 40 ? b.x + b.w + 1 : b.x - 9;

    if (s.sick && !s.asleep) blit(ITEM.cloud, b.x + Math.floor(b.w / 2) - 4, Math.max(0, b.y - 8));
    if (s.asleep) { blit(ITEM.z, 37, 3 + (tick % 2)); if (tick % 4 < 2) blit(ITEM.z, 42, 0); }

    if (anim) {
      const t = anim.type;
      if (t === 'eat') {
        const sp = anim.item === 'candy' ? ITEM.candy : ITEM.meal;
        const bites = Math.min(4, Math.floor(prog * 5));
        blit(sp, side, b.y + 6, 8 - bites * 2);
      } else if (t === 'pet') {
        [-3, Math.floor(b.w / 2) - 2, b.w - 2].forEach((o, i) => {
          const rise = Math.floor(((prog * 14) + i * 5) % 14);
          blit(ITEM.heart, b.x + o, b.y + 6 - rise);
        });
      } else if (t === 'bath') {
        const wx = Math.floor(prog * 52) - 2;
        for (let y = 0; y < 32; y += 3) { px(wx, y + (tick % 3)); px(wx - 2, y + 1 + (tick % 2)); px(wx + 1, y + 2); }
      } else if (t === 'toilet') {
        blit(ICON.toilet, side, b.y + 7);
        if (prog > .5) for (let i = 0; i < 3; i++) px(side + 2 + i * 2, b.y + 16 + ((tick + i) % 2));
      } else if (t === 'med') {
        blit(ICON.med, side, b.y + 6);
        sparkles(b.x + b.w / 2, b.y + b.h / 2, 10, tick, 3);
      } else if (t === 'hatch' || t === 'grow' || t === 'win') {
        sparkles(b.x + b.w / 2, b.y + b.h / 2, 12, tick, 4);
      }
    }
    flush(dark);
  }

  return {
    init(canvas) { canvas.width = W * C; canvas.height = H * C; ctx = canvas.getContext('2d'); },
    draw,
  };
})();

    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i]; d.y += d.vy * dt; d.x += Math.sin((t + i * 300) * 0.004) * 0.05; d.life -= dt / 1800;
      if (d.life <= 0 || d.y > H) dust.splice(i, 1);
    }
    dust.forEach(d => { if (d.life > 0.3 || Math.random() < .5) { P(main, d.x, d.y, d.c); if (d.life > 0.75) glow(main, d.x, d.y, 2.5, d.c, .3); } });
  }

  function sparkleRing(cx, cy, r, t, n) {
    glow(main, cx, cy, r + 4, 0xfff3b0, .25);
    fx.fill(0);
    for (let i = 0; i < n; i++) { const a = t * 0.003 + i * (Math.PI * 2 / n); star(fx, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.75, 2.8, T.gold, t * 0.005); }
    selout(fx, .5); comp(main, fx);
  }
  function panelBg(top, bot) {
    for (let y = 0; y < H; y++) main.fill(mix(top, bot, y / H), y * W, y * W + W);
    for (let y = 6; y < H; y += 12) for (let x = (y / 12 % 2) * 6 + 4; x < W; x += 12) P(main, x, y, mix(mix(top, bot, y / H), 0xffffff, .5));
  }
  function card(x, y, w, h, fill, border) {
    rect(main, x + 1, y + 1, w - 2, h - 2, fill);
    rect(main, x + 2, y, w - 4, 1, border); rect(main, x + 2, y + h - 1, w - 4, 1, border);
    rect(main, x, y + 2, 1, h - 4, border); rect(main, x + w - 1, y + 2, 1, h - 4, border);
    P(main, x + 1, y + 1, border); P(main, x + w - 2, y + 1, border); P(main, x + 1, y + h - 2, border); P(main, x + w - 2, y + h - 2, border);
  }
  const layer = fn => { fx.fill(0); fn(fx); selout(fx, .55); comp(main, fx); };
  const triUp = (B, cx, cy, s, c) => poly(B, [[cx, cy - s], [cx - s, cy + s * 0.4], [cx + s, cy + s * 0.4]], c);

  function draw(s, ui, now) {
    const t = now;
    const anim = ui.anim && now - ui.anim.t0 < ui.anim.dur ? ui.anim : null;
    const prog = anim ? (now - anim.t0) / anim.dur : 0;
    const blink = (t % 4300) < 130;

    if (s.gone) {
      scene(s, t, 'night');
      for (let i = 0; i < 14; i++) { const y = H - ((t * 0.012 + i * 17) % H), x = (i * 37 + 11) % W; P(main, x, y, i % 2 ? 0xffd95a : 0xffffff); glow(main, x, y, 3, 0xfff3b0, .3); }
      return flush();
    }

    if (ui.view === 'status') {
      panelBg(0xf7efff, 0xdcc9f3);
      const p = STATUS_PAGES[ui.page], val = pageValue(s, p);
      card(14, 22, 64, 64, 0xffffff, 0xb59ad6);
      layer(B => ICONF[p.k](B, 46, 54, 3));
      const full = Math.round(val / 25);
      layer(B => { for (let i = 0; i < 4; i++) heart(B, 101 + i * 22, 43, 1.5, i < full ? T.heart : T.heartE); });
      card(90, 64, 92, 11, 0xece6f4, 0xb59ad6);
      const fw = Math.round(88 * val / 100), bc = val < 25 ? T.red : val < 50 ? T.gold : T.dress;
      if (fw > 0) { rect(main, 92, 66, fw, 7, bc[1]); rect(main, 92, 66, fw, 2, bc[0]); rect(main, 92, 72, fw, 1, bc[2]); }
      for (let i = 0; i < STATUS_PAGES.length; i++) {
        const x = 78 + i * 6;
        if (i === ui.page) ball(main, x, 104, 2, T.potion); else P(main, x, 104, 0xb5a8c8);
      }
      return flush();
    }

    if (ui.view === 'food') {
      panelBg(0xfff6e6, 0xffd9c4);
      const sel = ui.foodIdx;
      card(22, 16, 64, 66, sel === 0 ? 0xffffff : 0xfff0e2, sel === 0 ? T.gold[2] : 0xf2d2bc);
      card(106, 16, 64, 66, sel === 1 ? 0xffffff : 0xfff0e2, sel === 1 ? T.gold[2] : 0xf2d2bc);
      layer(B => { bowl(B, 54, 52, 3); candy(B, 138, 49, 2.6); });
      if (sel === 0) glow(main, 54, 46, 26, 0xfff3b0, .2); else glow(main, 138, 49, 26, 0xfff3b0, .2);
      const bounce = Math.round(Math.sin(t * 0.008) * 2);
      layer(B => triUp(B, sel === 0 ? 54 : 138, 97 + bounce, 6, T.gold[1]));
      return flush();
    }

    scene(s, t);

    if (s.stage === 'bud') {
      drawBud(t, s.ageMin, anim && anim.type === 'hatch');
      if (anim && anim.type === 'hatch') sparkleRing(96, 63, 26, t, 6);
      if (s.lightsOff) { tint(main, 0x080620, .6); glow(main, 96, 63, 22, 0xfff1b0, .35); }
      return flush();
    }

    // sujeira
    if (s.poops) {
      layer(B => { for (let i = 0; i < s.poops; i++) poop(B, 178 - i * 16, GROUND + 1, 1.1); });
      for (let i = 0; i < s.poops; i++) {
        const x = 178 - i * 16, ph = Math.floor(t / 300 + i) % 2;
        for (let k = 0; k < 3; k++) { P(main, x - 3 + k * 3 + ph, GROUND - 14 - k % 2, 0x8fc46a); P(main, x - 3 + k * 3 + 1 - ph, GROUND - 16 - k % 2, 0x8fc46a); }
        P(main, x + Math.cos(t * 0.012 + i) * 6, GROUND - 16 + Math.sin(t * 0.017 + i) * 3, 0x2a2a35);
      }
    }

    const baby = s.stage === 'baby', half = baby ? 15 : 19;
    let face = faceFor(s, anim), hx;
    let F = s.asleep ? GROUND - 3 : (baby ? 93 : 92);
    const bob = s.asleep ? 0 : Math.round(Math.sin(t * 0.004) * 2);
    if (ui.view === 'game') {
      const g = ui.game;
      if (g.phase === 'ask') { hx = 96; face = 'neutral'; }
      else { hx = g.dir === 'L' ? 36 : 156; face = g.guess === g.dir ? 'happy' : 'sad'; }
    } else {
      const minX = 54, maxX = Math.max(minX, W - half - 4 - s.poops * 16);
      hx = minX + ui.px * (maxX - minX);
      if (anim && anim.type === 'refuse') hx += Math.floor(t / 90) % 2 ? 1 : -1;
    }
    const f = fairy(s.stage, hx, F + bob, face, t, blink && face !== 'happy' && face !== 'sleep');

    shadowAt(f.hx, Math.max(4, 11 - (GROUND - f.F) * 0.6), .3);
    if (s.lightsOff) { tint(main, 0x080620, .62); glow(main, f.hx, f.cy, 32, 0xfff1b0, .45); }
    glow(main, f.hx, f.cy, 24, 0xfff6d0, .1);
    if (f.star) glow(main, f.star[0], f.star[1], 9, 0xfff3b0, .45 + Math.sin(t * 0.006) * .15);
    comp(main, wing, .72);
    comp(main, body);
    stepDust(t, f, !s.asleep);

    if (ui.view === 'game') {
      const g = ui.game;
      layer(B => {
        for (let i = 0; i < 5; i++) {
          const x = 80 + i * 8;
          if (i < g.results.length) star(B, x, 8, 3.4, g.results[i] ? T.gold : T.heartE);
          else ball(B, x, 8, 1, T.porc);
        }
        if (g.phase === 'ask' && Math.floor(t / 300) % 2 === 0) {
          poly(B, [[6, 56], [16, 48], [16, 64]], T.gold[1]);
          poly(B, [[186, 56], [176, 48], [176, 64]], T.gold[1]);
        }
      });
      return flush();
    }

    if (s.sick && !s.asleep) {
      layer(B => cloud(B, f.hx, f.top - 7, 0.55, T.gray));
      for (let i = 0; i < 5; i++) { const x = f.hx - 6 + i * 3, y = f.top - 3 + ((Math.floor(t / 120) + i * 2) % 5); P(main, x, y, 0x5aa9e6); P(main, x, y + 1, 0x7fc4f0); }
    }
    if (s.asleep) layer(B => { for (let i = 0; i < 3; i++) { const p = ((t * 0.0005) + i / 3) % 1; zz(B, f.hx + 12 + p * 12, f.top + 4 - p * 20); } });

    if (anim) {
      const ty = anim.type;
      if (ty === 'eat') {
        const bites = Math.min(4, Math.floor(prog * 5)), right = f.side > f.hx;
        fx.fill(0);
        if (anim.item === 'candy') candy(fx, f.side, f.F - 12, 1); else bowl(fx, f.side, f.F - 10, 1);
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          if (right ? x < f.side - 8 + bites * 4 : x > f.side + 8 - bites * 4) fx[y * W + x] = 0;
        }
        selout(fx, .55); comp(main, fx);
      } else if (ty === 'pet') {
        layer(B => [-15, 0, 15].forEach((o, i) => { const rise = ((prog * 30) + i * 9) % 30; heart(B, f.hx + o, f.top + 12 - rise, 0.9); }));
      } else if (ty === 'bath') {
        glow(main, f.hx, f.cy, 26, 0xdff5ff, .35);
        for (let i = 0; i < 22; i++) {
          const bx = (i * 37 + 9) % (W - 8) + 4, by = H + 6 - ((prog * 150 + i * 13) % 130), r = 1 + (i % 3);
          for (let dy = -r - 1; dy <= r + 1; dy++) for (let dx = -r - 1; dx <= r + 1; dx++) {
            const d = dx * dx + dy * dy;
            if (d <= (r + 1) * (r + 1) && d >= r * r - 1) P(main, bx + dx, by + dy, dx < 0 && dy < 0 ? 0xffffff : 0xa9dcff);
          }
        }
      } else if (ty === 'toilet') {
        layer(B => potty(B, f.side, f.F - 6, 1));
        if (prog > .5) for (let i = 0; i < 3; i++) P(main, f.side - 2 + i * 2, f.F - 6 + Math.floor(t / 120 + i) % 2, T.water[2]);
      } else if (ty === 'med') {
        layer(B => potion(B, f.side, f.F - 10, 1));
        sparkleRing(f.hx, f.cy, 20, t, 4);
      } else if (['hatch', 'grow', 'win'].includes(ty)) {
        sparkleRing(f.hx, f.cy, 24, t, 6);
      }
    }
    flush();
  }

  function flush() {
    const d = img.data;
    for (let i = 0; i < main.length; i++) { const c = main[i]; d[i * 4] = (c >> 16) & 255; d[i * 4 + 1] = (c >> 8) & 255; d[i * 4 + 2] = c & 255; d[i * 4 + 3] = 255; }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, W * SC, H * SC);
  }

  return {
    init(canvas) {
      canvas.width = W * SC; canvas.height = H * SC;
      ctx = canvas.getContext('2d');
      off = document.createElement('canvas'); off.width = W; off.height = H;
      octx = off.getContext('2d'); img = octx.createImageData(W, H);
    },
    draw,
  };
})();

/* ---------- 4. UI ---------- */
const SAVE_KEY = 'fadagotchi-v1';
const ACTS = [
  { id: 'food', label: 'Comida' }, { id: 'pet', label: 'Carinho' }, { id: 'play', label: 'Brincar' }, { id: 'toilet', label: 'Banheiro' },
  { id: 'bath', label: 'Banho' }, { id: 'light', label: 'Luz' }, { id: 'med', label: 'Poção' }, { id: 'status', label: 'Status' },
];
const BAR_DEF = [
  { k: 'hunger', lbl: 'Barriga', sub: 'cheia ou com fome' },
  { k: 'affection', lbl: 'Carinho' },
  { k: 'fun', lbl: 'Diversão' },
  { k: 'bladder', lbl: 'Banheiro', sub: 'vontade de ir', inv: true },
  { k: 'hygiene', lbl: 'Higiene' },
  { k: 'energy', lbl: 'Energia' },
  { k: 'health', lbl: 'Saúde' },
];

let s, R;
const ui = { view: 'main', sel: -1, page: 0, foodIdx: 0, game: null, anim: null, px: 0.5, target: 0.5, nextWander: 0, msg: '', msgUntil: 0, lastAlert: false, confirmReset: false };
const $ = id => document.getElementById(id);

function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(newState(), o); } } catch (e) {}
  return null;
}
function save() { try { s.lastReal = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }

const hhmm = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function logEv(text) { s.log.unshift({ t: s.simTime, text }); s.log = s.log.slice(0, 8); }
function say(text, ms = 4500) { ui.msg = text; ui.msgUntil = performance.now() + ms; }
function anim(type, dur, extra = {}) { ui.anim = Object.assign({ type, t0: performance.now(), dur }, extra); }
let catchingUp = false;
Core.emit = ev => {
  const n = s.name;
  const map = {
    hatch: `O botão de flor abriu! ${n} nasceu.`,
    grow: `${n} cresceu e virou uma fada adulta!`,
    sleep: `${n} pegou no sono.`,
    wake: `${n} acordou.`,
    accident: `${n} não aguentou e fez sujeira no chão.`,
    sick: `${n} ficou doente.`,
    gone: `${n} voltou para a floresta.`,
  };
  logEv(map[ev]);
  if (!catchingUp) {
    say(map[ev]);
    if (ev === 'hatch' || ev === 'grow') anim(ev, 3000);
    if (ev === 'accident') anim('accident', 2500);
    if (ev === 'sick' || ev === 'accident') beep(330, .15, 2);
  }
};

function refuse(text) { anim('refuse', 1500); say(text); beep(200, .12); }

function act(id) {
  if (s.gone) return;
  if (s.stage === 'bud') { say('Ainda é um botão de flor. Espere ele abrir.'); return render(); }
  if (s.asleep && id !== 'light' && id !== 'status') { say(`${s.name} está dormindo. Shhh.`); return render(); }
  const n = s.name;
  beep(880, .04);
  switch (id) {
    case 'food': ui.view = 'food'; ui.foodIdx = 0; say('Refeição ou doce?', 60000); break;
    case 'pet':
      s.affection = cl(s.affection + 25); s.fun = cl(s.fun + 3);
      anim('pet', 2200); say(`${n} adorou o carinho.`); break;
    case 'play':
      if (s.sick) { refuse(`${n} está doente demais pra brincar.`); break; }
      if (s.energy < 15) { refuse(`${n} está cansada demais pra brincar.`); break; }
      ui.view = 'game'; ui.game = { phase: 'ask', results: [], guess: null, dir: null, t0: 0 };
      say('Pra que lado ela vai voar? A = esquerda, C = direita.', 60000); break;
    case 'toilet':
      if (s.bladder < 30) { refuse('Não estou com vontade agora.'); break; }
      s.bladder = 0; s.affection = cl(s.affection + 4);
      anim('toilet', 2400); say(`Muito bem! ${n} foi no banheirinho.`); logEv(`${n} usou o banheiro.`); break;
    case 'bath': {
      const had = s.poops; s.hygiene = 100; s.poops = 0;
      anim('bath', 2000); say(had ? 'Sujeira lavada, tudo limpinho!' : `${n} tomou banho e está cheirosa.`); break;
    }
    case 'light':
      s.lightsOff = !s.lightsOff;
      if (s.lightsOff) say(s.asleep ? 'Luz apagada. Bom sono.' : (s.energy < 60 ? 'Luz apagada. Ela vai cochilar.' : 'Luz apagada, mas ela ainda não está com sono.'));
      else say(s.asleep ? 'Luz acesa. Dormir com luz atrapalha o descanso.' : 'Luz acesa.');
      break;
    case 'med':
      if (!s.sick) { refuse(`${n} não está doente. Poção só quando precisar.`); break; }
      s.sick = false; s.health = cl(s.health + 20); s.fun = cl(s.fun - 5);
      anim('med', 2200); say('Poção tomada. Já está melhorando!'); logEv(`${n} tomou poção e sarou.`); break;
    case 'status': ui.view = 'status'; ui.page = 0; say('A ou B passa a página. C volta.', 60000); break;
  }
  render();
}

function feed(kind) {
  const n = s.name;
  ui.view = 'main';
  if (kind === 'meal') {
    if (s.hunger >= 95) { refuse('Estou cheia!'); return render(); }
    s.hunger = cl(s.hunger + 35); s.bladder = cl(s.bladder + 10);
    anim('eat', 2400, { item: 'meal' }); say(`Nhac! ${n} comeu a refeição.`);
  } else {
    s.hunger = cl(s.hunger + 8); s.fun = cl(s.fun + 15); s.sweets.push(s.simTime);
    anim('eat', 2000, { item: 'candy' });
    if (s.sweets.length > 3) { s.health = cl(s.health - 8); say('Doce demais faz mal pra barriga...'); }
    else say(`${n} amou o docinho.`);
  }
  render();
}

function gameGuess(g) {
  const game = ui.game;
  if (!game || game.phase !== 'ask') return;
  game.guess = g; game.dir = Math.random() < .5 ? 'L' : 'R';
  game.phase = 'show'; game.t0 = performance.now();
  const win = g === game.dir;
  game.results.push(win);
  beep(win ? 1046 : 220, .1);
  say(win ? 'Acertou!' : 'Errou...', 60000);
  render();
}
function gameTick(now) {
  const g = ui.game;
  if (!g || g.phase !== 'show' || now - g.t0 < 1300) return;
  if (g.results.length >= 5) {
    const wins = g.results.filter(Boolean).length;
    s.fun = cl(s.fun + 10 + wins * 8); s.energy = cl(s.energy - 6); s.hunger = cl(s.hunger - 4);
    ui.view = 'main'; ui.game = null;
    anim(wins >= 3 ? 'win' : 'lose', 2500);
    say(wins >= 3 ? `${wins} de 5! ${s.name} se divertiu muito.` : `${wins} de 5. Mesmo assim foi divertido.`);
    logEv(`Brincaram de adivinhar: ${wins} de 5.`);
  } else { g.phase = 'ask'; say('De novo! Pra que lado?', 60000); }
  render();
}

function pressA() {
  beep(660, .03);
  if (ui.view === 'game') return gameGuess('L');
  if (ui.view === 'food') { ui.foodIdx = 1 - ui.foodIdx; return render(); }
  if (ui.view === 'status') { ui.page = (ui.page + 1) % STATUS_PAGES.length; return render(); }
  ui.sel = (ui.sel + 1) % ACTS.length; render();
}
function pressB() {
  if (ui.view === 'game') return;
  if (ui.view === 'food') return feed(ui.foodIdx === 0 ? 'meal' : 'candy');
  if (ui.view === 'status') { ui.page = (ui.page + 1) % STATUS_PAGES.length; return render(); }
  if (ui.sel >= 0) act(ACTS[ui.sel].id);
}
function pressC() {
  beep(520, .03);
  if (ui.view === 'game') return gameGuess('R');
  if (ui.view !== 'main') { ui.view = 'main'; ui.msgUntil = 0; return render(); }
  ui.sel = -1; render();
}

/* som */
let actx = null;
function beep(freq, dur = .08, times = 1) {
  if (!s || !s.sound || !actx) return;
  for (let i = 0; i < times; i++) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq; g.gain.value = .05;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime + i * (dur + .06);
    o.start(t); o.stop(t + dur);
  }
}

/* ficha e ícones */
function drawIcon(canvas, sp, color) {
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, 8, 8); c.fillStyle = color;
  for (let y = 0; y < sp.h; y++) for (let x = 0; x < sp.w; x++) if (sp.d[y * sp.w + x]) c.fillRect(x, y, 1, 1);
}
function buildPanel() {
  $('bars').innerHTML = BAR_DEF.map(b => `
    <li class="bar"><span class="lbl">${b.lbl}${b.sub ? `<small>${b.sub}</small>` : ''}</span>
    <div class="track"><div class="fill" id="f-${b.k}"></div></div><span class="val" id="v-${b.k}"></span></li>`).join('');
  const mk = (row, list) => {
    $(row).innerHTML = '';
    list.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'ico'; btn.dataset.act = a.id; btn.title = a.label; btn.setAttribute('aria-label', a.label);
      const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8; btn.appendChild(cv);
      drawIcon(cv, ICON[a.id], '#2b2236');
      btn.addEventListener('click', () => { ui.sel = ACTS.indexOf(a); ui.view = 'main'; act(a.id); });
      btn.addEventListener('mouseenter', () => { ui.hover = a.label; render(); });
      btn.addEventListener('mouseleave', () => { ui.hover = null; render(); });
      $(row).appendChild(btn);
    });
  };
  mk('iconsTop', ACTS.slice(0, 4)); mk('iconsBottom', ACTS.slice(4));
}

function fmtAge(min) {
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = Math.floor(min % 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}min` : `${m} min`;
}
const STAGE_LABEL = { bud: 'Botão de flor', baby: 'Fadinha bebê', adult: 'Fada adulta' };

function sectionLabel() {
  if (ui.view === 'food') return ['Comida', ui.foodIdx === 0 ? 'Refeição' : 'Doce'];
  if (ui.view === 'status') { const p = STATUS_PAGES[ui.page]; return ['Status · ' + p.label, `${ui.page + 1}/${STATUS_PAGES.length}`]; }
  if (ui.view === 'game') return ['Brincar', `rodada ${Math.min(5, ui.game.results.length + (ui.game.phase === 'ask' ? 1 : 0))}/5`];
  if (ui.hover) return [ui.hover, ''];
  if (ui.sel >= 0) return [ACTS[ui.sel].label, 'B confirma'];
  return [s.name, hhmm(s.simTime)];
}

function render() {
  document.querySelectorAll('.ico').forEach(b => b.classList.toggle('on', ACTS[ui.sel] && b.dataset.act === ACTS[ui.sel].id));
  const [secName, secInfo] = sectionLabel();
  $('secName').textContent = secName; $('secInfo').textContent = secInfo;

  const needs = Core.needs(s);
  const alertOn = needs.length > 0;
  $('alert').classList.toggle('on', alertOn);
  if (alertOn && !ui.lastAlert) beep(1200, .08, 3);
  ui.lastAlert = alertOn;

  const n = s.name;
  let cap;
  if (performance.now() < ui.msgUntil) cap = ui.msg;
  else if (s.gone) cap = `${n} voltou para a floresta.`;
  else if (s.stage === 'bud') cap = 'Um botão de flor. Algo se mexe lá dentro...';
  else if (needs.length) cap = `${n} ${needs[0]}.`;
  else if (s.asleep) cap = s.lightsOff ? 'Zzz… dormindo.' : 'Zzz… dormindo, mas a luz está acesa.';
  else cap = { happy: `${n} está feliz, voando por aí.`, neutral: `${n} está tranquila.`, sad: `${n} não parece bem.` }[Core.mood(s)];
  $('caption').textContent = cap;

  const ch = $('choices');
  if (ui.view === 'food') {
    if (ch.hidden || !ch.querySelector('[data-k]')) {
      ch.innerHTML = '<button class="chip-btn" data-k="meal">Refeição</button><button class="chip-btn" data-k="candy">Doce</button>';
      ch.querySelectorAll('button').forEach(b => b.onclick = () => feed(b.dataset.k));
      ch.hidden = false;
    }
  } else if (ui.view === 'game') {
    if (ch.hidden || !ch.querySelector('[data-g]')) {
      ch.innerHTML = '<button class="chip-btn" data-g="L">◀ Esquerda</button><button class="chip-btn" data-g="R">Direita ▶</button>';
      ch.querySelectorAll('button').forEach(b => b.onclick = () => gameGuess(b.dataset.g));
      ch.hidden = false;
    }
  } else if (!ch.hidden) { ch.hidden = true; ch.innerHTML = ''; }

  if (document.activeElement !== $('nome')) $('nome').value = n;
  $('meta').textContent = `${STAGE_LABEL[s.stage]} · ${fmtAge(s.ageMin)} · ${hhmm(s.simTime)}`;
  const tags = [];
  if (s.gone) tags.push(['crit', 'foi embora']);
  if (s.sick) tags.push(['crit', 'doente']);
  if (s.asleep) tags.push(['', 'dormindo']);
  if (s.lightsOff) tags.push(['', 'luz apagada']);
  if (s.poops) tags.push(['warn', s.poops === 1 ? '1 sujeira no chão' : `${s.poops} sujeiras no chão`]);
  if (!tags.length && s.stage !== 'bud') tags.push(['ok', 'tudo em ordem']);
  $('tags').innerHTML = tags.map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join('');

  for (const b of BAR_DEF) {
    const v = s[b.k];
    const good = b.inv ? 100 - v : v;
    const f = $('f-' + b.k);
    f.style.width = v.toFixed(0) + '%';
    f.className = 'fill' + (good < 25 ? ' crit' : good < 50 ? ' warn' : '');
    $('v-' + b.k).textContent = Math.round(v);
  }
  $('log').innerHTML = s.log.length ? s.log.map(e => `<li><time>${hhmm(e.t)}</time>${e.text}</li>`).join('') : '<li>Nada aconteceu ainda.</li>';
  $('goneBox').hidden = !s.gone;
  if (s.gone) $('goneText').textContent = `${n} ficou fraca demais e voltou para a floresta. Fadas precisam de comida, carinho, banho e descanso todos os dias.`;
  $('speed').value = String(s.speed);
  $('skin').value = s.skin;
  $('sound').checked = !!s.sound;
}

function renderReset() {
  const w = $('resetWrap');
  if (ui.confirmReset) {
    w.innerHTML = 'Apagar tudo? <button class="ghost danger" id="rY">Sim, recomeçar</button> <button class="ghost" id="rN">Não</button>';
    $('rY').onclick = () => { restart(); ui.confirmReset = false; renderReset(); };
    $('rN').onclick = () => { ui.confirmReset = false; renderReset(); };
  } else {
    w.innerHTML = '<button class="ghost" id="reset">Recomeçar</button>';
    $('reset').onclick = () => { ui.confirmReset = true; renderReset(); };
  }
}
function restart() {
  const keep = { speed: s.speed, sound: s.sound, skin: s.skin };
  s = Object.assign(newState(), keep);
  logEv('Um novo botão de flor foi plantado.');
  ui.view = 'main'; ui.sel = -1; ui.anim = null; ui.px = 0.5;
  save(); render();
}
function setSkin() {
  R = s.skin === 'lcd' ? LcdRenderer : ColorRenderer;
  R.init($('lcd'));
  $('screen').style.background = s.skin === 'lcd' ? '#a9b897' : '#1d2350';
}

/* loop */
let lastTick = performance.now();
function frame(now) {
  const realDt = Math.min(5000, now - lastTick); lastTick = now;
  Core.advance(s, realDt / MIN * s.speed);

  if (ui.view === 'main' && !s.asleep && s.stage !== 'bud' && !s.gone && (!ui.anim || now - ui.anim.t0 > ui.anim.dur)) {
    if (now > ui.nextWander) { ui.target = Math.random(); ui.nextWander = now + 1800 + Math.random() * 2800; }
    const d = ui.target - ui.px;
    ui.px += Math.sign(d) * Math.min(Math.abs(d), realDt * 0.00022);
  }
  if (ui.view === 'game') gameTick(now);
  R.draw(s, ui, now);
  frame.acc = (frame.acc || 0) + realDt;
  if (frame.acc > 500) { frame.acc = 0; render(); }
  requestAnimationFrame(frame);
}

function start(snap) {
  s = (snap && snap.state) || load();
  if (!s) { s = newState(); logEv('Um botão de flor foi plantado.'); }
  else {
    s = Object.assign(newState(), s);
    const away = Math.min(3 * 24 * 60, (Date.now() - s.lastReal) / MIN);
    if (away > 1) { catchingUp = true; Core.advance(s, away); catchingUp = false; if (away > 30) say(`Você ficou fora ${fmtAge(away)}. Veja o diário.`, 7000); }
  }
  setSkin();
  buildPanel(); renderReset();

  $('bA').onclick = pressA; $('bB').onclick = pressB; $('bC').onclick = pressC;
  $('screen').addEventListener('click', e => {
    if (ui.view !== 'game') return;
    const r = e.currentTarget.getBoundingClientRect();
    gameGuess(e.clientX - r.left < r.width / 2 ? 'L' : 'R');
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select')) return;
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') { e.preventDefault(); pressA(); }
    else if (k === 'b' || k === 'enter' || k === ' ') { if (e.target.closest('button') && k !== 'b') return; e.preventDefault(); pressB(); }
    else if (k === 'c' || k === 'escape' || k === 'arrowright') { e.preventDefault(); pressC(); }
  });
  $('nome').addEventListener('input', e => { s.name = e.target.value.trim() || 'Lumi'; save(); });
  $('speed').addEventListener('change', e => { s.speed = Number(e.target.value); save(); });
  $('skin').addEventListener('change', e => { s.skin = e.target.value; setSkin(); save(); });
  $('sound').addEventListener('change', e => {
    s.sound = e.target.checked;
    if (s.sound && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    beep(880, .06); save();
  });
  $('restart2').onclick = restart;
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  window.claude?.hot?.snapshot?.(() => ({ state: s }));
  render();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
